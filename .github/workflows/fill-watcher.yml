# The fill watcher (ADR 0019) as a backup schedule. Vercel's Hobby plan runs a cron once a day at most.
# This asks for every 5 minutes, but on a free repo GitHub throttles scheduled runs to every few hours, so
# point an external scheduler (docs/11-test-plan.md) at the route for a real 1–2 minute cadence.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SITE_URL     https://declub.fun, no trailing slash
#   CRON_SECRET  the same value as the CRON_SECRET set in Vercel
name: fill-watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron/fills
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 70 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/fills"
